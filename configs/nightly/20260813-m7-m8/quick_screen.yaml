# M7/M8 schedule-confounded discovery screen.  Every primary candidate uses
# two folds, seed 42, 12 total epochs and the same five leakage-safe regimes,
# but universal/expert update counts differ. It cannot promote a model.
# Scores produced by this matrix are LOCAL STRICT OOF, never official GOAI PSS.
# M8 semantic tasks are explicitly RESEARCH candidate-identity experiments;
# they cannot be presented as verified-identity confirmation results.
# Workload: 22 primary candidates * 14 fits + 10 one-regime scale candidates
# * 2 fits = 328 fold fits total.
base_config: ../../experiments/m7_general_only.yaml
fold_seed: 42
n_folds: 2
cpu_threads_per_job: 8
protocol_label: LOCAL_STRICT_OOF_NOT_OFFICIAL
promotion_eligible: false
schedule_confounded: true

core_scenarios: &core_scenarios [R00, R10, R01, R11, RT]
registry_gate: &registry_gate
  chemical_registry: data/processed/entities/chemical_registry.tsv
  strain_registry: data/processed/entities/strain_registry.tsv
  chemical_parent_views: data/processed/entities/chemical_parent_normalized_views.tsv
  allow_proxy_semantics: false
  chemical_structure_view: exact
  semantic_identity_policy: research_allow_candidate
  # Quick candidate-identity screens are explicitly research-only and may
  # explore evidence before it satisfies the formal verified-only gate.
  semantic_training_coverage_required: false
quick_general: &quick_general
  epochs: 12
  universal_epochs: 9
  strain_expert_epochs: 0
  chemical_expert_epochs: 0
  pair_expert_epochs: 0
  joint_learning_rate_scale: 0.2

experiments:
  - id: SCR-M7.0-GENERAL
    kind: model_screen
    model_id: M7.0
    priority: 0
    scenarios: *core_scenarios
    seeds: [42]
    overrides:
      model: *quick_general

  - id: SCR-M7.1-STRAIN
    kind: model_screen
    model_id: M7.1
    priority: 1
    scenarios: *core_scenarios
    seeds: [42]
    overrides:
      model:
        <<: *quick_general
        universal_epochs: 7
        strain_expert_epochs: 2
        background_strain_expert_enabled: true
        response_strain_expert_enabled: true
        entity_dropout: 0.25

  - id: SCR-M7.2-CHEMICAL
    kind: model_screen
    model_id: M7.2
    priority: 1
    scenarios: *core_scenarios
    seeds: [42]
    overrides:
      model:
        <<: *quick_general
        universal_epochs: 7
        chemical_expert_epochs: 2
        response_chemical_expert_enabled: true
        entity_dropout: 0.25

  - id: SCR-M7.2-CHEM-PROTOTYPE
    kind: model_screen
    model_id: M7.2-prototype
    priority: 1
    scenarios: *core_scenarios
    seeds: [42]
    overrides:
      model:
        <<: *quick_general
        universal_epochs: 7
        chemical_expert_epochs: 2
        response_chemical_expert_enabled: true
        response_prior_mode: chemical
        response_prior_alpha: 4.0
        response_prior_learnable_scale: false
        entity_dropout: 0.25

  - id: SCR-M7.3-ENTITIES
    kind: model_screen
    model_id: M7.3
    priority: 2
    scenarios: *core_scenarios
