baseline_config: ../baseline.yaml

# E1-A: closed-data control. In S1 the held-out chemical one-hot block is zero,
# so the model has no transferable chemical identity.
model:
  hidden_dim: 128
  response_rank: 64
  calibration_rank: 16
  dropout: 0.10
  learning_rate: 0.001
  weight_decay: 0.0002
  epochs: 80
  batch_size: 128
  seed: 42
  device: cuda:1
  absolute_weight: 0.25
  background_weight: 1.0
  fc_weight: 1.0
  target_scale_floor: 0.10
  calibration_enabled: true

entity:
  chemical_map: null
  strain_features: null
  chemical_bits: 512

graph:
  variant: none
  artifact: null
  weight: 0.0

runtime:
  runs_dir: ../../runs/experiments/chemistry_s1_none
